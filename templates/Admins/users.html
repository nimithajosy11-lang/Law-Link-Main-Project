<div class="row m-5">
    {% for i in view %}
    <div class="col">
        <div class="card" style="width: 350px;">
            <img src="../static/media/{{ i.image }}" class="card-img-top" alt="...">
            <div class="card-body">
                <center>
                    <h5 class="card-title"><b>{{ i.name }}</b></h5>
                    <p class="card-text">
                        <b>Email</b>: {{ i.email }} <br>
                        <img src="/static/image/contacts.png" width="20px" alt=""> Contact: {{ i.phone }} <br>
                        {{ i.address }} <br>
                        Date of Birth: {{ i.dob }} <br>
                        <img src="/static/image/gender.png" width="20px"> Gender: {{ i.gender }}
                    </p>
                    <div>
                        <a href="{% url 'approve_user' i.loginid.id %}" class="btn btn-success">Approve</a>
                        <a href="{% url 'reject_user' i.loginid.id %}" class="btn btn-danger">Reject</a>
                    </div>
                </center>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
